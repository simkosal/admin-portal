name: invoiceninja_flutter
description: Client for Invoice Ninja
version: 5.0.175+175
homepage: https://invoiceninja.com
documentation: https://invoiceninja.github.io
publish_to: none

environment:
  sdk: ">=3.1.0 <4.0.0"

flutter_icons:
  android: true
  ios: true
  image_path: "assets/images/mobile_icon.png"
  adaptive_icon_foreground: "assets/images/mobile_icon.png"
  adaptive_icon_background: "#0091EA"
  remove_alpha_ios: true

dependencies:
  boardview:
    git:
      url: https://github.com/BenPoell/FlutterBoardView.git
  built_collection: ^5.1.0
  built_value: ^8.1.2
  change_app_package_name: null
  charts_flutter: ^0.12.0
  collection: ^1.15.0-nullsafety.4
  connectivity_plus: ^3.0.0
  contacts_service: ^0.6.3
  desktop_drop: ^0.4.1
  device_info_plus: 9.1.0
  diacritic: ^0.1.3
  file_picker: ^5.2.5
  filesystem_picker: ^4.0.0
  flutter:
    sdk: flutter
  flutter_colorpicker: ^1.0.3
  flutter_json_viewer: ^1.0.1
  flutter_launcher_icons: null
  flutter_localizations:
    sdk: flutter
  flutter_redux: ^0.10.0
  flutter_slidable: ^3.0.0
  flutter_staggered_grid_view: ^0.7.0
  flutter_styled_toast: ^2.0.0
  google_sign_in: 5.4.4
  html2md: ^1.2.6
  http: ^0.13.5
  image_cropper: ^4.0.1
