  in_app_purchase: ^3.1.1
  in_app_review: ^2.0.4
  intl: 0.17.0
  intl_phone_field: ^3.1.0
  ios_open_subscriptions_settings: ^0.0.4
  local_auth: ^2.1.5
  material_design_icons_flutter: ^7.0.7296
  memoize: ^3.0.0
  msal_js: ^2.14.0
  overflow_view: ^0.3.1
  package_info: ^2.0.2
  path_provider: ^2.0.2
  permission_handler: ^11.0.1
  pinch_zoom: ^1.0.0
  pinput: ^3.0.1
  pointer_interceptor: ^0.9.0
  printing: ^5.11.0
  font_awesome_flutter:
  iconify_flutter:
  textfield_tags:
